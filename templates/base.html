<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Restaurant Watcher{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f6f4; --card: #fff; --text: #1c1c1a; --muted: #6b6b66;
      --line: #e2e2dd; --accent: #7a4fd6;
      --ok: #197a4b; --warn: #9a6100; --bad: #b3261e;
      --ok-bg: #e6f4ec; --warn-bg: #fdf1dc; --bad-bg: #fbe9e7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17171a; --card: #202024; --text: #ecece9; --muted: #9c9c96;
        --line: #33333a; --accent: #b79bf0;
        --ok: #6ede9f; --warn: #f0c070; --bad: #f2a29a;
        --ok-bg: #16301f; --warn-bg: #33270f; --bad-bg: #331a17;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 2rem 1rem 4rem; background: var(--bg); color: var(--text);
      font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 60rem; margin: 0 auto; }
    a { color: var(--accent); }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
    h2 { font-size: 1rem; margin: 2rem 0 .75rem; }
    .sub { color: var(--muted); margin: 0 0 1.5rem; font-size: .875rem; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 10px; overflow: hidden;
    }
    .stats { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 1.5rem; padding: 0; list-style: none; }
    .stats li {
      background: var(--card); border: 1px solid var(--line); border-radius: 8px;
      padding: .5rem .75rem; min-width: 5.5rem;
    }
    .stats b { display: block; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
    .stats span { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .6rem .75rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
    tr:last-child td { border-bottom: 0; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    th.num { text-align: right; }
    .badge {
      display: inline-block; padding: .1rem .45rem; border-radius: 99px;
      font-size: .75rem; font-weight: 600; white-space: nowrap;
    }
    .badge.ok { background: var(--ok-bg); color: var(--ok); }
    .badge.warn { background: var(--warn-bg); color: var(--warn); }
    .badge.bad { background: var(--bad-bg); color: var(--bad); }
    .muted { color: var(--muted); }
    .small { font-size: .8125rem; }
    .row-archived td:not(.keep) { opacity: .55; }
    .empty { padding: 2rem .75rem; text-align: center; color: var(--muted); }
    .flashes { list-style: none; margin: 0 0 1.25rem; padding: 0; }
    .flashes li {
      border: 1px solid var(--line); border-left-width: 3px; border-radius: 8px;
      background: var(--card); padding: .6rem .75rem; margin-bottom: .5rem;
    }
    .flashes li.info { border-left-color: var(--accent); }
    .flashes li.warn { border-left-color: var(--warn); background: var(--warn-bg); color: var(--warn); }
    button.action {
      font: inherit; font-size: .8125rem; cursor: pointer; color: var(--text);
      background: var(--card); border: 1px solid var(--line);
      border-radius: 6px; padding: .2rem .55rem;
    }
    button.action:hover { border-color: var(--accent); color: var(--accent); }
    form.inline { display: inline; margin: 0; }
    .name { font-weight: 600; }
    .summary-text { margin: .2rem 0 0; max-width: 34rem; }
    @media (max-width: 40rem) {
      th, td { padding: .5rem .6rem; }
      .hide-narrow { display: none; }
    }
  </style>
</head>
<body>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flashes">
          {% for category, message in messages %}
            <li class="{{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
