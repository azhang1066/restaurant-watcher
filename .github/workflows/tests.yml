name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -c requirements-lock.txt -r requirements-dev.txt
      - run: ruff check .
      - run: mypy
      - run: python -m pytest -q
